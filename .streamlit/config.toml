[theme]
base = "light"
primaryColor = "#1D4ED8"
backgroundColor = "#F5F6F8"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#111827"
borderColor = "#D8DFE8"
dataframeBorderColor = "#D8DFE8"
dataframeHeaderBackgroundColor = "#F8FAFC"
dataframeHeaderTextColor = "#0F294A"
baseRadius = "0.5rem"
buttonRadius = "0.375rem"
showWidgetBorder = true
showSidebarBorder = true
metricValueFontSize = "1.35rem"
metricValueFontWeight = 700

[theme.sidebar]
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F8FAFC"
borderColor = "#D8DFE8"
